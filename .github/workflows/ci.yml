name: Automated validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install built wheel, replacing source installation
        shell: bash
        run: python -m pip install --force-reinstall --no-deps dist/*.whl
      - run: python -m pip check
      - name: Test installed package outside repository
        shell: bash
        run: |
          cp -r tests "$RUNNER_TEMP/embedded-tests"
          cp pyproject.toml "$RUNNER_TEMP/pyproject.toml"
          cd "$RUNNER_TEMP"
          python -m pytest embedded-tests -q --import-mode=importlib
          embedded-demo --output demo-output
      - uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/demo-output
